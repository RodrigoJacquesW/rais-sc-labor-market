# BigQuery with your gcloud login (gcloud auth application-default login).
# The Base dos Dados tables are in the US multi-region, so the datasets must be too.
rais_sc:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: rais_sc
      location: US
      threads: 4
      job_execution_timeout_seconds: 600
      priority: interactive
